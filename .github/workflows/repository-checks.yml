name: Repository checks
on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 ref, 2026-10-28
        with:
          persist-credentials: false
      - name: Validate scaffold (not product acceptance)
        run: python3 scripts/check_repository.py
  prototype-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test prototype (not Astra acceptance)
        run: python3 -B -m unittest discover -s tests -v
