name: Branch policy
# Trusted base-branch workflow. Never check out or execute pull-request code here.
on:
  pull_request_target:
    branches: [prod, dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [prod, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce allowed source and target
        shell: python
        run: |
          import json
          import os
          import re
          import sys
          from pathlib import Path

          if os.environ['GITHUB_EVENT_NAME'] != 'pull_request_target':
              print('Branch policy is enforced when a pull request is opened or updated.')
              sys.exit(0)
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event['pull_request']
          head = pr['head']['ref']
          base = pr['base']['ref']
          source_repo = (pr['head'].get('repo') or {}).get('full_name')
          if source_repo != os.environ['GITHUB_REPOSITORY']:
              sys.exit('Team PRs must originate from a branch in this repository.')
          if base == 'prod' and head != 'dev':
              sys.exit('Only dev -> prod pull requests are allowed.')
          if base == 'dev' and not re.fullmatch(r'(feature|fix|test|docs|ci|chore)/[A-Za-z0-9][A-Za-z0-9._/-]*', head):
              sys.exit('Use a feature/, fix/, test/, docs/, ci/ or chore/ branch from dev.')
          print(f'Allowed branch route: {head} -> {base}')
