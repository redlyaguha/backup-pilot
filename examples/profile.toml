# Профиль прототипа. Скопировать как demo.toml в --profiles-dir. Только учебные пути.
# keep_last и schedule пока не запускают retention или systemd.
name = "demo"
source = "/srv/backup-pilot-demo/source"
destination = "/srv/backup-pilot-demo/backups"
exclude = ["*.tmp", "cache/**"]
keep_last = 7
schedule = "daily"
